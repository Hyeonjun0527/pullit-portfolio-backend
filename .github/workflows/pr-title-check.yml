name: PR Title Check

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

jobs:
  check-pr-title:
    if: ${{ !github.event.pull_request.draft }}
    name: PR title check
    runs-on: ubuntu-latest
    steps:
      - name: Verify the conventional Korean or English title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PR_TITLE" | grep -Eq '^(feat|fix|docs|chore|refactor|ci|test)(\([^)]+\))?: .+'
